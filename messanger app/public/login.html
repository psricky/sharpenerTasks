<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Login</h1>

            <div class="input-group">

                <label for="emailOrPhone">
                    Email or Phone Number
                </label>

                <input
                    type="text"
                    id="emailOrPhone"
                    placeholder="Enter Email or Phone">

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

            </div>

            <button id="loginBtn">

                Login

            </button>

            <p id="message"></p>

            <p>

                Don't have an account?

                <a href="/signup">

                    Sign Up

                </a>

            </p>

        </div>

    </div>

    <script src="/js/login.js"></script>

</body>

</html>
