<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chat Application</title>

    <link rel="stylesheet"
          href="/css/chat.css">

</head>

<body>

<div class="chat-container">

    <!-- Header -->

    <div class="chat-header">

        <img src="https://via.placeholder.com/45"
             class="profile">

        <div>

            <h3>John Doe</h3>

            <small>Online</small>

        </div>

    </div>


    <!-- Messages -->

    <div
        class="chat-body"
        id="chatBody">

        <div class="message received">

            <p>Hello 👋</p>

            <span>10:15 AM</span>

        </div>

        <div class="message sent">

            <p>Hi! How are you?</p>

            <span>10:16 AM</span>

        </div>

    </div>


    <!-- Footer -->

    <div class="chat-footer">

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message">

        <button
            id="sendBtn">

            Send

        </button>

    </div>

</div>

<script src="/js/chat.js"></script>

</body>

</html>
